<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城市图鉴 · 地图查询</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.css">
<style>
:root{--green:#146b59;--ink:#172d31;--muted:#77868a;--line:#e8eeeb}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f4f7f4;font:15px/1.5 "Microsoft YaHei","PingFang SC",sans-serif}button,input{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 18%,#dcebe0,transparent 38%),linear-gradient(130deg,#f2f6f0,#eef3ef)}.login-card{width:min(960px,100%);min-height:540px;display:grid;grid-template-columns:1.1fr .9fr;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 24px 70px #18362b18}.welcome{padding:48px;background:#deece1;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}.kicker{color:var(--green);font-size:11px;letter-spacing:2px;font-weight:bold}.welcome h1{font-size:38px;line-height:1.3;margin:15px 0}.welcome p{color:#607870;max-width:330px}.globe{position:absolute;right:28px;bottom:80px;width:230px;height:230px;border:1px solid #6fa18b;border-radius:50%;opacity:.7}.globe:before,.globe:after{content:"";position:absolute;border:1px solid #6fa18b;border-radius:50%;inset:25px 65px}.globe:after{inset:65px 0}.form{padding:58px;display:flex;flex-direction:column;justify-content:center}.form h2{font-size:27px;margin:0 0 5px}.muted{color:var(--muted);margin:0 0 25px}.form label{font-size:13px;font-weight:600;margin-bottom:14px}.form input,.search input{width:100%;padding:13px;border:1px solid #dce5e0;border-radius:9px;margin-top:8px;outline:none}.form input:focus,.search input:focus{border-color:#4c9a84;box-shadow:0 0 0 3px #4c9a8418}.primary{padding:13px;border:0;border-radius:9px;background:var(--green);color:white;cursor:pointer;font-weight:bold}.hint{text-align:center;color:#8a9691;font-size:12px;margin-top:12px}.app{display:none;height:100vh;grid-template-rows:64px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:bold;display:flex;align-items:center;gap:9px}.logo,.avatar{width:33px;height:33px;border-radius:10px;background:#e3f0e8;color:var(--green);display:grid;place-items:center}.top-right{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.avatar{border-radius:50%;font-weight:bold}.layout{display:grid;grid-template-columns:310px 1fr;min-height:0}.side{background:#fff;border-right:1px solid var(--line);padding:24px 20px;overflow:auto}.side h2{font-size:22px;margin:4px 0}.side .muted{font-size:13px;margin:0 0 18px}.search{position:relative}.search input{padding-right:46px}.search button{position:absolute;right:5px;top:13px;width:34px;height:34px;border:0;border-radius:7px;background:var(--green);color:#fff;cursor:pointer;font-size:18px}.label{font-size:11px;font-weight:bold;letter-spacing:1px;color:#929e99;margin:23px 0 9px}.cities{display:grid;grid-template-columns:1fr 1fr;gap:8px}.city{padding:9px;border:1px solid var(--line);border-radius:9px;background:white;text-align:left;cursor:pointer}.city:hover,.city.active{background:#edf6f0;border-color:#b8d7c6}.city b{display:block;font-size:13px}.city span{font-size:10px;color:var(--muted)}.tip{margin-top:20px;padding:11px;border-radius:9px;background:#f5f8f5;color:#75827c;font-size:11px}.map-area{position:relative;min-width:0;padding:17px}.map-heading{position:absolute;z-index:500;left:34px;top:32px;background:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 4px 18px #172e3216;pointer-events:none}.map-heading b{display:block;font-size:15px}.map-heading span{font-size:11px;color:var(--muted)}#mapView{height:100%;min-height:380px;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px #172e3210}.toast{position:fixed;z-index:1000;bottom:22px;left:50%;transform:translateX(-50%);background:#173b32;color:white;padding:10px 15px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}@media(max-width:700px){.login-card{grid-template-columns:1fr}.welcome{padding:28px;min-height:240px}.welcome h1{font-size:29px}.globe{width:140px;height:140px;right:24px;bottom:20px}.form{padding:30px}.app{height:auto;min-height:100vh;grid-template-rows:58px 1fr}.top{padding:0 14px}.layout{grid-template-columns:1fr;grid-template-rows:auto 55vh}.side{padding:15px}.cities{grid-template-columns:repeat(4,1fr)}.city{text-align:center;padding:8px 3px}.city span{display:none}.map-area{padding:9px}.map-heading{left:23px;top:23px}}
</style></head><body>
<section class="login" id="loginPage"><div class="login-card"><div class="welcome"><div><div class="kicker">CITY ATLAS　·　城市图鉴</div><h1>发现城市<br>从地图开始。</h1><p>搜索城市，查看真实地图位置。让每一次出发都有方向。</p></div><div class="globe"></div><div class="kicker">城市地图查询系统</div></div><form class="form" id="loginForm"><h2>欢迎使用</h2><p class="muted">输入账号和密码进入地图</p><label>账号<input id="account" placeholder="请输入账号" autocomplete="username"></label><label>密码<input id="password" type="password" placeholder="请输入密码" autocomplete="current-password"></label><button class="primary">登录并开始探索　→</button><div class="hint">演示页面：输入任意账号和密码即可登录</div></form></div></section>
<section class="app" id="app"><header class="top"><div class="brand"><div class="logo">⌖</div>城市图鉴</div><div class="top-right"><span>地图查询</span><div class="avatar" id="avatar">A</div><span id="userName">访客</span></div></header><div class="layout"><aside class="side"><div class="kicker">EXPLORE PLACES</div><h2>城市地图</h2><p class="muted">搜索一个城市，看看它在哪里。</p><div class="search"><input id="query" list="cityNames" placeholder="搜索城市，例如：杭州"><datalist id="cityNames"></datalist><button id="searchBtn" aria-label="搜索">⌕</button></div><div class="label">热门城市</div><div class="cities" id="cities"></div><div class="tip">地图支持拖动和缩放。点选城市卡片或输入名称即可定位。</div></aside><section class="map-area"><div class="map-heading"><b id="placeTitle">中国 · 城市地图</b><span id="placeSub">搜索或选择城市查看位置</span></div><div id="mapView"></div></section></div></section><div class="toast" id="toast"></div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.19.0/dist/maplibre-gl.mjs';
const places=[['北京','Beijing',39.9042,116.4074],['上海','Shanghai',31.2304,121.4737],['广州','Guangzhou',23.1291,113.2644],['深圳','Shenzhen',22.5431,114.0579],['杭州','Hangzhou',30.2741,120.1551],['成都','Chengdu',30.5728,104.0668],['武汉','Wuhan',30.5928,114.3055],['西安','Xian',34.3416,108.9398],['南京','Nanjing',32.0603,118.7969],['重庆','Chongqing',29.563,106.5516],['天津','Tianjin',39.0842,117.201],['苏州','Suzhou',31.2989,120.5853],['青岛','Qingdao',36.0671,120.3826],['厦门','Xiamen',24.4798,118.0894],['昆明','Kunming',24.8801,102.8329],['长沙','Changsha',28.2282,112.9388]];
const map=new maplibregl.Map({container:'mapView',style:'https://tiles.openfreemap.org/styles/positron',center:[104.1,35.9],zoom:3.7});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');let marker;const cities=document.querySelector('#cities'),query=document.querySelector('#query');document.querySelector('#cityNames').innerHTML=places.map(p=>`<option value="${p[0]}">`).join('');cities.innerHTML=places.slice(0,8).map(p=>`<button class="city" data-name="${p[0]}"><b>${p[0]}</b><span>${p[1]}</span></button>`).join('');
function findPlace(){const q=query.value.trim().toLowerCase(),p=places.find(x=>x[0].toLowerCase()===q||x[1].toLowerCase()===q)||places.find(x=>q&&(x[0].includes(q)||x[1].toLowerCase().includes(q)));if(!p){say(q?'暂未收录该城市':'请输入城市名称');return}map.flyTo({center:[p[3],p[2]],zoom:10.5,duration:900});if(marker)marker.remove();marker=new maplibregl.Marker({color:'#146b59'}).setLngLat([p[3],p[2]]).setPopup(new maplibregl.Popup({offset:25}).setText(`${p[0]} · ${p[1]}`)).addTo(map);marker.togglePopup();document.querySelector('#placeTitle').textContent=p[0]+' · '+p[1];document.querySelector('#placeSub').textContent=`${p[2].toFixed(4)}° N　${p[3].toFixed(4)}° E`;cities.querySelectorAll('.city').forEach(b=>b.classList.toggle('active',b.dataset.name===p[0]));say('已定位到'+p[0])}
function say(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}document.querySelector('#loginForm').addEventListener('submit',e=>{e.preventDefault();const name=document.querySelector('#account').value.trim();if(!name||!document.querySelector('#password').value){say('请先填写账号和密码');return}document.querySelector('#loginPage').style.display='none';document.querySelector('#app').style.display='grid';document.querySelector('#userName').textContent=name;document.querySelector('#avatar').textContent=name[0].toUpperCase();setTimeout(()=>map.resize(),100)});document.querySelector('#searchBtn').onclick=findPlace;query.addEventListener('keydown',e=>{if(e.key==='Enter')findPlace()});cities.addEventListener('click',e=>{const b=e.target.closest('[data-name]');if(b){query.value=b.dataset.name;findPlace()}});
</script></body></html>
